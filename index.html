<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, Malaysia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #eaf6ff;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #2d5a27; margin: 0 0 1rem; }
    svg { width: 260px; height: auto; }
  </style>
</head>
<body>
  <h1>Hello, Malaysia!</h1>
  <svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink flower with green stem and leaves">
    <!-- stem -->
    <path d="M100 120 C95 170 105 220 100 270" stroke="#3a8a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M100 210 C70 200 55 180 50 165 C80 165 98 185 100 210 Z" fill="#4caf50"/>
    <path d="M101 235 C130 225 145 205 150 190 C120 190 103 210 101 235 Z" fill="#43a047"/>
    <!-- petals -->
    <g fill="#ff8fb8" stroke="#e5608f" stroke-width="1.5">
      <ellipse cx="100" cy="58" rx="16" ry="30"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(45 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(90 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(135 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(180 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(225 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(270 100 90)"/>
      <ellipse cx="100" cy="58" rx="16" ry="30" transform="rotate(315 100 90)"/>
    </g>
    <!-- center -->
    <circle cx="100" cy="90" r="17" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  </svg>
</body>
</html>
