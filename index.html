<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, Thakral Family</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #7b3fb5;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    h1 { color: #ffffff; margin: 0 0 1rem; }
    svg { width: 460px; max-width: 95vw; height: auto; overflow: visible; }

    /* Everything pivots in SVG user units */
    .dragon, .head, .wing, .tail, .leg, .fire, .shadow, .note {
      transform-box: view-box;
    }

    /* 8-count choreography loop: side steps, bounce, lean, hip sway, pose */
    .dragon { transform-origin: 150px 210px; animation: dance 8s ease-in-out infinite; }
    @keyframes dance {
      0%   { transform: translate(0, 0) rotate(0deg); }
      6%   { transform: translate(-28px, -14px) rotate(-7deg); }   /* step left */
      12%  { transform: translate(-28px, 0) rotate(-7deg); }
      18%  { transform: translate(0, -14px) rotate(0deg); }        /* step back to centre */
      25%  { transform: translate(28px, 0) rotate(7deg); }         /* step right */
      31%  { transform: translate(28px, -14px) rotate(7deg); }
      37%  { transform: translate(0, 0) rotate(0deg); }
      /* double bounce */
      42%  { transform: translate(0, -22px) rotate(0deg); }
      47%  { transform: translate(0, 0) rotate(0deg); }
      52%  { transform: translate(0, -22px) rotate(0deg); }
      57%  { transform: translate(0, 0) rotate(0deg); }
      /* lean back, then forward wave */
      66%  { transform: translate(-10px, 0) rotate(-12deg); }
      76%  { transform: translate(14px, 0) rotate(10deg); }
      /* hip sway and freeze pose */
      84%  { transform: translate(-14px, -6px) rotate(-5deg); }
      92%  { transform: translate(14px, -6px) rotate(5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Head bobs on the beat */
    .head { transform-origin: 200px 150px; animation: bob 0.5s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }

    /* Wings flap */
    .wing { transform-origin: 140px 120px; animation: flap 1s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: rotate(-14deg) scaleY(1); } to { transform: rotate(10deg) scaleY(0.82); } }

    /* Tail wags */
    .tail { transform-origin: 95px 165px; animation: wag 1s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }

    /* Legs alternate stepping on the beat */
    .leg-a { transform-origin: 115px 175px; animation: step 1s ease-in-out infinite; }
    .leg-b { transform-origin: 185px 175px; animation: step 1s ease-in-out infinite; animation-delay: -0.5s; }
    @keyframes step {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-10px) rotate(-14deg); }
    }

    /* Fire breathing on and off */
    .fire { transform-origin: 300px 62px; opacity: 0; animation: breathe 6s linear infinite; }
    @keyframes breathe {
      0%, 14%   { opacity: 0; transform: scale(0.2); }
      18%       { opacity: 1; transform: scale(1.1); }
      22%       { opacity: 1; transform: scale(0.9); }
      26%       { opacity: 1; transform: scale(1.25); }
      30%       { opacity: 1; transform: scale(1); }
      34%, 62%  { opacity: 0; transform: scale(0.2); }
      66%       { opacity: 1; transform: scale(1.2); }
      70%       { opacity: 1; transform: scale(0.9); }
      74%       { opacity: 1; transform: scale(1.3); }
      80%, 100% { opacity: 0; transform: scale(0.2); }
    }

    /* Floating music notes */
    .note { font-size: 22px; fill: #ffe082; opacity: 0; animation: float 3s ease-out infinite; }
    .note.n2 { animation-delay: 1s; }
    .note.n3 { animation-delay: 2s; }
    @keyframes float {
      0%   { opacity: 0; transform: translateY(0); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-60px); }
    }

    /* Ground shadow pulses with the bounce */
    .shadow { transform-origin: 150px 222px; animation: pulse 0.5s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scaleX(1); opacity: 0.35; } to { transform: scaleX(0.85); opacity: 0.2; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fire { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <h1>Hello, Thakral Family!</h1>
  <svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A green dragon dancing and breathing fire on and off">
    <ellipse class="shadow" cx="150" cy="222" rx="95" ry="8" fill="#000"/>

    <text class="note" x="40" y="60">♪</text>
    <text class="note n2" x="270" y="150">♫</text>
    <text class="note n3" x="20" y="120">♪</text>

    <g class="dragon">
      <!-- tail -->
      <g class="tail">
        <path d="M95 160 C60 170 40 150 20 175 C40 165 55 190 90 185 Z" fill="#2e9e4f" stroke="#1b6b32" stroke-width="2"/>
        <path d="M20 175 L8 160 L28 165 Z" fill="#c62828"/>
      </g>

      <!-- wing -->
      <g class="wing">
        <path d="M125 120 C110 70 140 35 190 25 C180 55 195 80 175 120 Z" fill="#b71c1c" stroke="#7f0000" stroke-width="2"/>
        <path d="M150 115 C145 80 160 55 190 25" stroke="#7f0000" stroke-width="2" fill="none"/>
      </g>

      <!-- legs -->
      <g class="leg leg-a">
        <rect x="105" y="170" width="20" height="40" rx="8" fill="#2e9e4f" stroke="#1b6b32" stroke-width="2"/>
        <path d="M100 210 h30" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g class="leg leg-b">
        <rect x="175" y="170" width="20" height="40" rx="8" fill="#2e9e4f" stroke="#1b6b32" stroke-width="2"/>
        <path d="M170 210 h30" stroke="#f5f5f5" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- body -->
      <ellipse cx="150" cy="150" rx="65" ry="40" fill="#3fb865" stroke="#1b6b32" stroke-width="2"/>
      <ellipse cx="155" cy="165" rx="45" ry="22" fill="#d9f2b0"/>

      <!-- back spikes -->
      <g fill="#c62828">
        <path d="M115 115 l8 -18 l8 20 Z"/>
        <path d="M140 110 l8 -18 l8 20 Z"/>
        <path d="M165 112 l8 -18 l8 20 Z"/>
      </g>

      <!-- neck + head -->
      <g class="head">
        <path d="M185 130 C225 120 225 85 215 65 L245 70 C255 100 245 145 205 175 Z" fill="#3fb865" stroke="#1b6b32" stroke-width="2"/>
        <path d="M198 100 l12 -12 l2 18 Z" fill="#c62828"/>
        <path d="M215 65 C215 40 245 30 270 45 L300 55 C305 65 290 75 270 78 C255 90 230 85 215 65 Z" fill="#3fb865" stroke="#1b6b32" stroke-width="2"/>
        <path d="M232 40 L222 15 L248 35 Z" fill="#f5e6b8" stroke="#a68b3c" stroke-width="1.5"/>
        <path d="M250 36 L248 12 L265 38 Z" fill="#f5e6b8" stroke="#a68b3c" stroke-width="1.5"/>
        <circle cx="255" cy="52" r="6" fill="#fff"/>
        <circle cx="257" cy="52" r="3" fill="#111"/>
        <circle cx="293" cy="57" r="2" fill="#1b6b32"/>
        <path d="M270 70 Q285 72 298 64" stroke="#1b6b32" stroke-width="2" fill="none"/>

        <!-- fire (intermittent) -->
        <g class="fire">
          <path d="M302 62 C320 38 350 48 360 62 C350 66 365 78 345 84 C330 92 312 82 302 70 Z" fill="#ff9800"/>
          <path d="M304 64 C318 52 336 56 344 63 C336 68 340 74 330 77 C318 80 310 74 304 68 Z" fill="#ffeb3b"/>
        </g>
      </g>
    </g>
  </svg>
</body>
</html>
